name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      package_installer:
        description: Build, install-test, and upload a Windows development installer
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Activate x64 MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check native build prerequisites
        shell: pwsh
        run: |
          if (Test-Path 'C:\Strawberry\perl\bin') {
            'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = 'C:\Strawberry\perl\bin;' + $env:PATH
          }
          Get-Command perl -ErrorAction Stop
          Get-Command cl, nmake, link -ErrorAction Stop
          perl --version
          if (Get-Command nasm -ErrorAction SilentlyContinue) {
            nasm -v
          } else {
            Write-Host 'NASM is optional; vendored OpenSSL supports building without assembly.'
          }
          rustc --version
          node --version

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify application version consistency
        run: npm run check:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Test Rust application and persistence
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust application and tests
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build embedded Windows application without packaging
        run: npm run tauri -- build --debug --no-bundle --ci -- --locked

      - name: Build Windows installer
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        run: npm run tauri -- build --ci --bundles nsis -- --locked

      - name: Test installer, application launch, and uninstall
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer; found $($installers.Count)."
          }
          ./scripts/windows-package-smoke.ps1 -InstallerPath $installers[0].FullName

      - name: Prepare download instructions and checksums
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        shell: pwsh
        run: ./scripts/windows-download-info.ps1

      - name: Upload Windows installer
        if: github.event_name == 'workflow_dispatch' && inputs.package_installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/README.txt
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer validation log
        if: always() && github.event_name == 'workflow_dispatch' && inputs.package_installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-logs
          path: ${{ runner.temp }}/eisenbart-windows-validation/
          if-no-files-found: ignore
          retention-days: 14
