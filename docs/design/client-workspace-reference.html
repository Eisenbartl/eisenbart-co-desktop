<script>
'use strict';
const initialClients=[
 {id:'C-0001',name:'Jon Doe',initials:'JD',email:'johndoe@test.com',phone:'512-555-5555',status:'New Intake',last:'Oct 13, 2026',step:'Review intake and planning data',household:'1',goals:'Budgeting and paying off debt.',note:'John works in construction.',income:3000,necessary:1175,debt:5000,debtPay:200,debtPlan:'May 2029',verified:false},
 {id:'C-0002',name:'Sara Smith',initials:'SS',email:'smithsara@test.com',phone:'',status:'New Intake',last:'Not yet reviewed',step:'Complete client intake',household:'',goals:'',note:'',income:null,necessary:null,debt:null,debtPay:null,debtPlan:null,verified:false}
];
let clients=initialClients.map(x=>({...x}));
let openTabs=['directory'];let activeTab='directory';let clientSection={};let directoryQuery='';let directoryStatus='all';let detailState={method:'snowball',period:'3',reviewTab:'transactions'};
const sectionGroups=[{label:'Workspace',items:[['overview','◫','Overview'],['profile','♙','Profile & intake'],['notes','☷','Session notes']]},{label:'Planning tools',items:[['budget','▤','Monthly budget'],['debt','▥','Debt payoff'],['savings','◇','Savings & sinking funds'],['cashflow','▦','Cash-flow calendar'],['scenarios','⇆','Scenario comparisons']]},{label:'Documents & review',items:[['statements','▣','Import statements'],['reviews','☑','Review & reconciliation'],['financial','▧','Financial dashboard'],['assessments','✎','Assessments & reports']]}];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=v=>v==null?'Unknown':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v);
const statusClass=s=>s==='New Intake'?'intake':s==='In Progress'?'progress':'review';
const button=(text,action,kind='')=>`<button class="btn ${kind}" data-action="${action}">${text}</button>`;
function setToast(str){document.getElementById('toasthost').innerHTML=`<div class="toast">${e(str)}</div>`;setTimeout(()=>document.getElementById('toasthost').innerHTML='',3700)}
function getClient(id){return clients.find(c=>c.id===id)}
function switchTab(id){if(id!=='directory'&&!getClient(id))return;if(!openTabs.includes(id))openTabs.push(id);activeTab=id;clientSection[id]=clientSection[id]||'overview';render()}
function closeTab(id){openTabs=openTabs.filter(t=>t!==id);if(activeTab===id)activeTab=openTabs[openTabs.length-1]||'directory';render()}
function render(){document.getElementById('tabs').innerHTML=openTabs.map(t=>{const label=t==='directory'?'▦ &nbsp; All clients':e(getClient(t)?.name||'Client');return `<div class="app-tab ${activeTab===t?'active':''}" role="tab" aria-selected="${activeTab===t}" data-tab="${e(t)}"><span>${label}</span>${t==='directory'?'':`<button class="tabclose" data-close="${e(t)}" title="Close ${label} tab" aria-label="Close tab">×</button>`}</div>`}).join('');
document.getElementById('breadcrumb').textContent=activeTab==='directory'?'Clients':getClient(activeTab)?.name||'Clients';document.getElementById('main').innerHTML=activeTab==='directory'?renderDirectory():renderClient(getClient(activeTab));}
function renderDirectory(){const q=directoryQuery.toLowerCase().trim();const rows=clients.filter(c=>(directoryStatus==='all'||c.status===directoryStatus)&&[c.name,c.email,c.phone].join(' ').toLowerCase().includes(q));return `
 <div class="page-intro"><div><div class="eyebrow">People & progress</div><h1>Clients</h1><div class="subtitle">Your client directory. Search, review progress, and open a dedicated workspace for each client.</div></div>${button('+ &nbsp; Add client','add-client','primary')}</div>
 <div class="statgrid"><div class="stat"><div class="stat-label">Total clients</div><div class="stat-number">${clients.length}</div><div class="stat-foot">Fictional records in this preview</div></div><div class="stat"><div class="stat-label">New intakes</div><div class="stat-number">${clients.filter(c=>c.status==='New Intake').length}</div><div class="stat-foot">Not yet moved to in progress</div></div><div class="stat"><div class="stat-label">In progress</div><div class="stat-number">${clients.filter(c=>c.status==='In Progress').length}</div><div class="stat-foot">Active counseling work</div></div><div class="stat"><div class="stat-label">Pending reviews</div><div class="stat-number">0</div><div class="stat-foot">No imported items in demo</div></div></div>
 <section class="panel directory"><div class="directory-head"><div><div class="section-title">Client directory</div><div class="section-description">Select a client to open their dashboard in a workspace tab.</div></div><div class="directory-tools"><input id="directory-search" class="field search-field" type="search" placeholder="Search name, email, or phone" aria-label="Search clients" value="${e(directoryQuery)}"><select class="filter" id="directory-filter" aria-label="Filter by status"><option value="all" ${directoryStatus==='all'?'selected':''}>All statuses</option><option ${directoryStatus==='New Intake'?'selected':''}>New Intake</option><option ${directoryStatus==='In Progress'?'selected':''}>In Progress</option><option ${directoryStatus==='Needs Review'?'selected':''}>Needs Review</option></select></div></div><div style="overflow-x:auto"><table class="clienttable"><thead><tr><th>Client</th><th>Client ID</th><th>Status</th><th>Last activity</th><th>Next step</th><th style="text-align:right">Open</th></tr></thead><tbody>${rows.length?rows.map(c=>`<tr><td><div class="person-cell"><div class="avatar">${e(c.initials)}</div><div><div class="person-name">${e(c.name)}</div><div class="tiny">${e(c.email)}</div></div></div></td><td>${e(c.id)}</td><td><span class="status ${statusClass(c.status)}">${e(c.status)}</span></td><td>${e(c.last)}</td><td>${e(c.step)}</td><td style="text-align:right"><button class="client-open" data-open="${e(c.id)}">Open workspace ↗</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><strong>No matching clients</strong><p>Try adjusting your search or status filter.</p></div></td></tr>`}</tbody></table></div><div class="directory-foot">Showing ${rows.length} of ${clients.length} clients · Preview uses fictional data only</div></section>
 <div class="directory-help"><div class="helpicon">i</div><span>The directory stays open while client workspaces are organized in separate tabs above. Each client also has a separate review queue, planning tools, and notes.</span></div>`}
function renderClient(c){if(!c)return '';const sec=clientSection[c.id]||'overview';return `<div class="client-header"><div class="identity"><div class="largeavatar">${e(c.initials)}</div><div><div class="client-status"><span class="eyebrow">Client workspace</span><span class="status ${statusClass(c.status)}">${e(c.status)}</span></div><h1>${e(c.name)}</h1><div class="clientmeta"><span>${e(c.id)}</span><span>${e(c.email)}</span>${c.phone?`<span>${e(c.phone)}</span>`:''}<span>Updated ${e(c.last)}</span></div></div></div><div class="btn-row">${button('+ Session note','go-notes')}${button('Import statement','go-statements')}${button('Create assessment','go-assessments','primary')}</div></div><div class="worklayout"><aside class="panel localnav" aria-label="Client sections">${sectionGroups.map(g=>`<div class="localnav-heading">${g.label}</div>${g.items.map(([key,icon,name])=>`<button class="localnav-btn ${sec===key?'active':''}" data-section="${key}"><span class="glyph">${icon}</span>${name}</button>`).join('')}`).join('')}<div class="localnav-note">All sections belong to <strong>${e(c.name)}</strong>. Switching sections never changes the selected client.</div></aside><section class="client-main">${renderSection(sec,c)}</section></div>`}
function moduleHeader(title,desc,action=''){return `<div class="module-header"><div><div class="eyebrow">Client workspace</div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function panel(title,content,extra=''){return `<section class="panel module-panel ${extra}"><h3>${title}</h3>${content}</section>`}
function keyrow(a,b){return `<div class="keyrow"><span>${a}</span><strong>${b}</strong></div>`}
function overview(c){return `${moduleHeader('Overview','A quick briefing before your next counseling session. No need to scroll through every tool.',button('View profile','go-profile'))}
${c.id==='C-0001'?`<div class="alert"><strong>Needs attention · Budget and debt plan are out of sync</strong><p>The debt simulation uses a $200 monthly payment, but the saved budget allocates $0 to debt. Review both plans before relying on combined projections.</p></div>`:`<div class="alert"><strong>Intake is not complete</strong><p>No financial plan or imported statements are available for this fictional client yet.</p></div>`}
<div class="metricgrid"><div class="metric"><span class="stat-label">Monthly take-home income</span><strong>${usd(c.income)}</strong><div class="explain">${c.income==null?'Not entered':'Counselor estimate'}</div></div><div class="metric"><span class="stat-label">Necessary monthly expenses</span><strong>${usd(c.necessary)}</strong><div class="explain">${c.necessary==null?'Not entered':'Saved budget · estimated'}</div></div><div class="metric"><span class="stat-label">Unallocated monthly cash</span><strong>${c.income!=null&&c.necessary!=null?usd(c.income-c.necessary):'Unknown'}</strong><div class="explain">Before debt and savings allocations</div></div><div class="metric"><span class="stat-label">Outstanding planned debt</span><strong>${usd(c.debt)}</strong><div class="explain">${c.debt==null?'Not entered':'Entered debt plan · unverified'}</div></div></div>
<div class="cols"><div class="stack">${panel('Planning snapshot',`<div class="keyrows">${keyrow('Budget status',c.income!=null?'Saved · revise allocations':'Not started')}${keyrow('Debt strategy',c.debtPlan?`Projected payoff ${e(c.debtPlan)}`:'Not started')}${keyrow('Emergency fund goal',c.necessary!=null?`${usd(c.necessary*3)} · 3 months`:'Not calculated')}${keyrow('Savings balance','Not provided')}${keyrow('Approved statement transactions','None imported')}</div><div class="notice">Planning figures are separate from verified statement activity. This dashboard never silently treats missing values as zero.</div>`)}${panel('Quick access',`<div class="actiontiles"><button class="actiontile" data-section="budget"><span><strong>Monthly budget</strong><small>Income, expenses & allocations</small></span><span class="arrow">↗</span></button><button class="actiontile" data-section="debt"><span><strong>Debt payoff</strong><small>Snowball vs. avalanche</small></span><span class="arrow">↗</span></button><button class="actiontile" data-section="savings"><span><strong>Savings planning</strong><small>Emergency & sinking funds</small></span><span class="arrow">↗</span></button><button class="actiontile" data-section="reviews"><span><strong>Transactions & review</strong><small>Import, approve & reconcile</small></span><span class="arrow">↗</span></button></div>`)}</div><div class="stack">${panel('Next steps',`<div class="task"><div class="taskicon">!</div><div><strong>${c.id==='C-0001'?'Reconcile debt payment allocation':'Complete intake'}</strong><p>${c.id==='C-0001'?'Confirm the $200 debt schedule against the saved monthly budget.':'Collect the household details and counseling goals.'}</p></div></div><div class="task"><div class="taskicon">2</div><div><strong>Import and review statements</strong><p>Assess verified activity without overwriting planning amounts.</p></div></div><div class="task"><div class="taskicon">3</div><div><strong>Establish savings balances</strong><p>Separate available emergency cash from reserved funds.</p></div></div>`)}${panel('Latest counseling note',`<div class="subhead">${e(c.last)}</div><p>${c.note?e(c.note):'No counseling notes have been added.'}</p><button class="outline-link" data-section="notes">Open session history →</button>`)}${panel('Counseling progress',`<div class="keyrow"><span>Current status</span><span class="status ${statusClass(c.status)}">${e(c.status)}</span></div><p>Keep the client’s profile, assessments, and session history together, without putting the entire record on one screen.</p><button class="outline-link" data-section="profile">Edit client profile →</button>`)}</div></div><div class="footnote">This is a design preview with fictional records. The final application should derive every summary from each client’s saved and approved data, with source and revision labels.</div>`}
function profile(c){return `${moduleHeader('Profile & intake','Personal information, goals, and counseling stage — separated from all planning tools.',button('Session history','go-notes'))}${panel('Client record',`<div class="formgrid"><div class="formgroup"><label>Client name</label><input readonly value="${e(c.name)}"></div><div class="formgroup"><label>Client identifier</label><input readonly value="${e(c.id)}"></div><div class="formgroup"><label>Email</label><input readonly value="${e(c.email)}"></div><div class="formgroup"><label>Phone</label><input readonly value="${e(c.phone)}" placeholder="Not provided"></div><div class="formgroup"><label>Household size</label><input readonly value="${e(c.household)}" placeholder="Not provided"></div><div class="formgroup"><label>Counseling status</label><input readonly value="${e(c.status)}"></div><div class="formgroup" style="grid-column:1/-1"><label>Counseling goals</label><textarea readonly>${e(c.goals)}</textarea></div></div><div class="hint">Read-only sample fields. In the finished app, edits should have explicit Save and Cancel controls and be logged with author and date.</div>`)}`}
function notes(c){return `${moduleHeader('Session notes','A dated record of counseling sessions, decisions, and next steps.',button('+ New note','new-note','primary'))}${panel('Counseling history',`<div class="timeline" id="sessiontimeline">${c.note?`<div class="timeentry"><strong>Counselor</strong><small>Oct 13, 2026 · 2:53 PM</small><p>${e(c.note)}</p></div>`:''}${(c.demoNotes||[]).map(n=>`<div class="timeentry"><strong>Demo session note</strong><small>${e(n.date)}</small><p>${e(n.text)}</p></div>`).join('')}${!c.note&&!(c.demoNotes||[]).length?'<p>No session notes yet.</p>':''}</div><div class="notice">Once saved in production, previous notes should remain immutable. Corrections belong in new dated entries.</div>`)}`}
function budget(c){const values=c.income!=null;return `${moduleHeader('Monthly budget','Manage planned income, necessities, discretionary spending, and savings or debt allocations.',button('Debt planner','go-debt'))}${values?`<div class="metricgrid"><div class="metric"><span class="stat-label">Take-home income</span><strong>${usd(c.income)}</strong><div class="explain">Estimated monthly</div></div><div class="metric"><span class="stat-label">Necessary expenses</span><strong>${usd(c.necessary)}</strong><div class="explain">Saved budget</div></div><div class="metric"><span class="stat-label">Proposed savings</span><strong>$0.00</strong><div class="explain">Not yet allocated</div></div><div class="metric"><span class="stat-label">Unallocated / deficit</span><strong>${usd(c.income-c.necessary)}</strong><div class="explain">Before additional allocations</div></div></div>`:''}${panel('Monthly plan breakdown',values?`<table class="data-table"><thead><tr><th>Category</th><th>Type</th><th>Source</th><th>Monthly equivalent</th></tr></thead><tbody><tr><td>Work</td><td>Take-home income</td><td><span class="tag estimated">Estimated</span></td><td>${usd(c.income)}</td></tr><tr><td>Necessary spending</td><td>Expenses</td><td><span class="tag estimated">Estimated</span></td><td>${usd(c.necessary)}</td></tr><tr><td>Debt payments</td><td>Allocation</td><td><span class="tag">Saved budget</span></td><td>$0.00</td></tr></tbody></table><div class="hint">Individual bill lines can be edited in the actual planning form. This compact summary shows their monthly totals first.</div>`:`<div class="empty"><strong>Budget not started</strong><p>Enter monthly income and expenses to begin a spending plan.</p></div>`)}<div style="height:16px"></div>${panel('Budget review',`<div class="alert" style="margin:0 0 14px"><strong>Review before recommendations</strong><p>${values?'Your simulated debt payment of $200 is not yet reflected in budget allocations.':'The budget needs income and expense data.'}</p></div><button class="btn" data-action="budget-demo">${values?'Edit budget details':'Start budget'}</button><div class="hint">Preview only: the edit action explains where the existing production form will live; it does not change these fictional records.</div>`)}`}
function debt(c){return `${moduleHeader('Debt payoff','Compare repayment strategies, with assumptions and the underlying budget visible.',button('Budget','go-budget'))}${c.debt!=null?`<div class="alert"><strong>Budget reconciliation needed</strong><p>Debt planner uses ${usd(c.debtPay)} per month; budget has $0 in debt allocations. These must agree before using combined scenarios.</p></div><div class="metricgrid"><div class="metric"><span class="stat-label">Outstanding balance</span><strong>${usd(c.debt)}</strong><div class="explain">Counselor-entered</div></div><div class="metric"><span class="stat-label">Monthly planned payment</span><strong>${usd(c.debtPay)}</strong><div class="explain">Includes minimum payments</div></div><div class="metric"><span class="stat-label">Payoff month</span><strong>May 2029</strong><div class="explain">Model estimate</div></div><div class="metric"><span class="stat-label">Projected interest</span><strong>$1,313.97</strong><div class="explain">Model estimate</div></div></div>${panel('Snowball and avalanche comparison',`<div class="rows2"><div class="mini-card"><span class="stat-label">Snowball · Smallest balance first</span><strong>May 2029</strong><small>Estimated payoff · $1,313.97 interest</small></div><div class="mini-card"><span class="stat-label">Avalanche · Highest APR first</span><strong>May 2029</strong><small>Estimated payoff · $1,313.97 interest</small></div></div><div class="hint">Both models match because this sample includes one debt. Simulations use APR ÷ 12, end-of-month payments, and no new borrowing.</div>`)}<div style="height:16px"></div>${panel('Monthly payment schedule',`<div class="subtabs"><button class="subtab ${detailState.method==='snowball'?'active':''}" data-method="snowball">Snowball</button><button class="subtab ${detailState.method==='avalanche'?'active':''}" data-method="avalanche">Avalanche</button></div><table class="data-table"><thead><tr><th>Month</th><th>Debt</th><th>Interest</th><th>Payment</th><th>Closing balance</th></tr></thead><tbody><tr><td>Oct 2026</td><td>Credit card</td><td>$75.00</td><td>$200.00</td><td>$4,875.00</td></tr></tbody></table><div class="hint">First month only in the preview. The production calculation should preserve its full schedule, fees, variable rates, and terms.</div><div class="pillrow"><button class="btn" data-action="debt-demo">Edit debts and payment changes</button></div>`)}`:`${panel('No debt plan',`<div class="empty"><strong>No debts entered</strong><p>Add debt accounts to compare repayment methods.</p><button class="btn" data-action="debt-demo">Start debt plan</button></div>`)}`}`}
function savings(c){return `${moduleHeader('Savings & sinking funds','Set emergency coverage, reserve cash for recurring needs, and avoid counting the same dollar twice.',button('Cash-flow calendar','go-cashflow'))}<div class="metricgrid"><div class="metric"><span class="stat-label">Essential monthly expenses</span><strong>${usd(c.necessary)}</strong><div class="explain">Saved budget reference</div></div><div class="metric"><span class="stat-label">Emergency target</span><strong>${c.necessary!=null?usd(c.necessary*Number(detailState.period)):'Unknown'}</strong><div class="explain">${detailState.period}-month goal</div></div><div class="metric"><span class="stat-label">Accessible emergency cash</span><strong>Unknown</strong><div class="explain">Not supplied</div></div><div class="metric"><span class="stat-label">Monthly savings contribution</span><strong>Unknown</strong><div class="explain">Not supplied</div></div></div>${panel('Emergency goal settings',`<div class="subhead">Target coverage</div><div class="pillrow">${['1','3','6'].map(x=>`<button class="pill ${detailState.period===x?'active':''}" data-period="${x}">${x} ${x==='1'?'month':'months'}</button>`).join('')}</div><div class="hint">The target changes with necessary monthly spending, not total income or spending. Savings dates stay unknown until balances and contributions are entered.</div>`)}<div style="height:16px"></div>${panel('Savings buckets & sinking funds',`<div class="empty"><div class="emptyicon">◇</div><strong>No savings balance or sinking funds entered</strong><p>Reserve upcoming bills, restricted funds, and specific goals before calculating true emergency cash.</p><button class="btn" data-action="savings-demo">Add a savings bucket</button></div>`)}`}
function cashflow(c){return `${moduleHeader('Cash-flow calendar','Forecast the timing of paychecks and bills, not just monthly income minus expenses.',button('Budget summary','go-budget'))}${panel('Daily cash availability',`<div class="formgrid"><div class="formgroup"><label>Forecast start</label><input type="date" value="2026-10-16" aria-label="Forecast start" readonly></div><div class="formgroup"><label>Forecast end</label><input type="date" value="2026-11-15" aria-label="Forecast end" readonly></div></div><div style="height:16px"></div><div class="empty"><div class="emptyicon">▦</div><strong>Calendar is waiting for dated activity</strong><p>Add account opening balances, paycheck dates, and expected bill dates. Unknown schedules should remain unknown, not automatically estimated.</p><button class="btn" data-action="cashflow-demo">Set up paydays and bills</button></div>`)}<div style="height:16px"></div>${panel('Forecast rules',`<div class="notice">Track checking and savings separately, pair internal transfers, distinguish scheduled transactions from estimates, and flag negative projected daily balances.</div>`)}`}
function scenarios(c){return `${moduleHeader('Scenario comparisons','Evaluate coordinated changes to cash flow, savings goals, and debt repayment.',button('Savings','go-savings'))}${panel('Scenario workspace',`<div class="empty"><div class="emptyicon">⇆</div><strong>Choose a starting scenario</strong><p>Compare baseline, increased debt repayment, and savings-first plans without changing the client's saved records.</p><button class="btn" data-action="scenario-demo">Create sample scenario</button></div>`)}<div style="height:16px"></div>${panel('Comparison inputs',`<div class="rows2"><div class="mini-card"><span class="stat-label">Budget revision</span><strong style="font-size:17px">2</strong><small>Referenced in screenshot</small></div><div class="mini-card"><span class="stat-label">Debt plan revision</span><strong style="font-size:17px">8</strong><small>Referenced in screenshot</small></div></div><div class="hint">In production, snapshots should identify exactly which plan revisions were used.</div>`)}`}
function statements(c){return `${moduleHeader('Import statements','Keep document intake separate from planning and from the transaction approval workflow.',button('Review queue','go-reviews'))}${panel('Add a financial statement',`<div class="formgrid"><div class="formgroup"><label>Document format</label><select id="format"><option>CSV</option><option>Selectable-text PDF</option></select></div><div class="formgroup"><label>Related account</label><select><option>Select an account…</option><option>Checking</option><option>Savings</option></select></div></div><div class="pillrow"><button class="btn" data-action="import-demo">Choose local file</button><button class="btn" data-action="import-demo">Inspect and map</button></div><div class="notice">Do not import real statements in this preview. Production should preserve the source document, show an extraction review, identify duplicates, and require approval before financial dashboard totals update.</div>`)}<div style="height:16px"></div>${panel('Imported documents',`<div class="empty"><div class="emptyicon">▣</div><strong>No source documents imported for this client</strong><p>Client-level imports will appear here with status, account, statement period, and a link to the review queue.</p></div>`)}`}
function reviews(c){return `${moduleHeader('Review & reconciliation','One focused queue for classifications, source figures, recurring payments, and transfers.',button('Import statement','go-statements'))}${panel('Pending review queue',`<div class="formgrid"><div class="formgroup"><label>Review status</label><select><option>All statuses</option><option>Pending</option><option>Needs Clarification</option><option>Approved</option><option>Rejected</option></select></div><div class="formgroup"><label>Account</label><select><option>All accounts</option><option>Checking</option><option>Savings</option></select></div></div><div class="subtabs" style="margin-top:16px"><button class="subtab ${detailState.reviewTab==='transactions'?'active':''}" data-review="transactions">Transactions</button><button class="subtab ${detailState.reviewTab==='figures'?'active':''}" data-review="figures">Statement figures</button><button class="subtab ${detailState.reviewTab==='balances'?'active':''}" data-review="balances">Balance checks</button><button class="subtab ${detailState.reviewTab==='merchants'?'active':''}" data-review="merchants">Recurring payments</button><button class="subtab ${detailState.reviewTab==='transfers'?'active':''}" data-review="transfers">Transfers</button></div><div class="empty"><div class="emptyicon">☑</div><strong>No ${e(({transactions:'transactions',figures:'statement figures',balances:'balance checks',merchants:'merchant groups',transfers:'internal transfers'})[detailState.reviewTab])} to review yet</strong><p>Imported records for this client will appear here. Filters belong in the review workspace, not across the entire client record.</p><button class="btn" data-action="go-statements">Import a statement</button></div>`)}`}
function financial(c){return `${moduleHeader('Financial dashboard','Read-only assessment built from approved statement transactions — never from unapproved estimates.',button('Import data','go-statements'))}${panel('Assessment period',`<div class="formgrid"><div class="formgroup"><label>From month</label><input placeholder="YYYY-MM" aria-label="Assessment from month"></div><div class="formgroup"><label>Through month</label><input placeholder="YYYY-MM" aria-label="Assessment through month"></div></div><div style="height:15px"></div><div class="empty"><div class="emptyicon">▧</div><strong>No approved transaction history</strong><p>Once imported transactions are reviewed, this dashboard can show verified income, expenses by category, and progress between statement periods.</p><button class="btn" data-action="go-reviews">Open review queue</button></div>`)}<div style="height:16px"></div>${panel('When verified data is available',`<div class="notice">Show income-versus-spending bars, an expense-category breakdown, monthly trends, completeness status, and comparisons to the saved plan. Never display an estimated budget as an observed transaction.</div>`)}`}
function assessments(c){return `${moduleHeader('Assessments & reports','Counselor conclusions, dated snapshots, and client-ready action plans.',button('Session notes','go-notes'))}${panel('Counselor assessments',`<div class="empty"><div class="emptyicon">✎</div><strong>No assessment on record</strong><p>Complete the review and financial assessment, then save a dated snapshot with risks, recommendations, and follow-up tasks.</p><button class="btn" data-action="assessment-demo">New assessment</button></div>`)}<div style="height:16px"></div>${panel('Client action plan',`<div class="keyrows">${keyrow('Planned next step',c.step)}${keyrow('Document completeness','No approved statements')}${keyrow('Export status','Not generated')}</div><button class="btn" data-action="report-demo">Prepare client PDF</button><div class="hint">Reports should clearly distinguish documented facts, client-provided amounts, and planning assumptions.</div>`)}`}
function renderSection(sec,c){return ({overview,profile,notes,budget,debt,savings,cashflow,scenarios,statements,reviews,financial,assessments}[sec]||overview)(c)}
function goto(sec){if(activeTab==='directory')return;clientSection[activeTab]=sec;render();window.scrollTo({top:0,behavior:'instant'})}
function modalAdd(){document.getElementById('modalhost').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="eyebrow">Fictional test records</div><h2 id="modal-title">Add demo client</h2><p class="subtitle">Adds a temporary fictional record to the prototype only.</p><form id="new-client-form"><div class="formgrid"><div class="formgroup"><label for="demo-first">First name</label><input id="demo-first" name="first" required maxlength="35" placeholder="Jane"></div><div class="formgroup"><label for="demo-last">Last name</label><input id="demo-last" name="last" required maxlength="35" placeholder="Sample"></div><div class="formgroup" style="grid-column:1/-1"><label for="demo-email">Email (optional)</label><input id="demo-email" name="email" type="email" placeholder="jane@example.test"></div></div><div class="modalfooter"><button class="btn" type="button" data-action="modal-close">Cancel</button><button type="submit" class="btn primary">Add to directory</button></div></form></div></div>`;document.getElementById('demo-first').focus()}
function modalNote(){document.getElementById('modalhost').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="eyebrow">Fictional test records</div><h2 id="modal-title">New counseling note</h2><p class="subtitle">Adds a temporary note to this demo client's timeline.</p><form id="new-note-form"><div class="formgroup"><label for="new-note">Session note</label><textarea id="new-note" required maxlength="500" placeholder="Discussion, client decisions, and next steps..."></textarea></div><div class="modalfooter"><button type="button" class="btn" data-action="modal-close">Cancel</button><button class="btn primary" type="submit">Save demo note</button></div></form></div></div>`;document.getElementById('new-note').focus()}
function act(action){switch(action){case 'add-client':modalAdd();break;case 'modal-close':document.getElementById('modalhost').innerHTML='';break;case 'new-note':modalNote();break;case 'go-profile':goto('profile');break;case 'go-notes':goto('notes');break;case 'go-budget':goto('budget');break;case 'go-debt':goto('debt');break;case 'go-savings':goto('savings');break;case 'go-cashflow':goto('cashflow');break;case 'go-statements':goto('statements');break;case 'go-reviews':goto('reviews');break;case 'go-assessments':goto('assessments');break;case 'import-demo':setToast('Preview only: document import is not connected.');break;case 'budget-demo':setToast('The detailed budget editor would open here in the production app.');break;case 'debt-demo':setToast('The existing debt editor and schedule would open here.');break;case 'savings-demo':setToast('The existing savings and sinking fund editor would open here.');break;case 'cashflow-demo':setToast('The existing dated cash-flow editor would open here.');break;case 'scenario-demo':setToast('The existing scenario builder would open here.');break;case 'assessment-demo':setToast('The existing counselor assessment editor would open here.');break;case 'report-demo':setToast('Preview only: PDF generation is not connected.');break;default:setToast('This is a navigation/design preview.')}}
document.addEventListener('click',ev=>{const x=ev.target.closest('button,[data-tab]');if(!x)return;if(x.dataset.close){ev.stopPropagation();closeTab(x.dataset.close);return}if(x.dataset.tab){switchTab(x.dataset.tab);return}if(x.dataset.open){switchTab(x.dataset.open);return}if(x.dataset.section){goto(x.dataset.section);return}if(x.dataset.period){detailState.period=x.dataset.period;render();return}if(x.dataset.method){detailState.method=x.dataset.method;render();return}if(x.dataset.review){detailState.reviewTab=x.dataset.review;render();return}if(x.dataset.action){act(x.dataset.action);return}if(x.dataset.main){if(x.dataset.main==='clients')switchTab('directory');else setToast('This mockup focuses on the Clients area.');return}});
document.addEventListener('input',ev=>{if(ev.target.id==='directory-search'){directoryQuery=ev.target.value;const start=ev.target.selectionStart;render();const search=document.getElementById('directory-search');if(search){search.focus();search.setSelectionRange(start,start)}}});
document.addEventListener('change',ev=>{if(ev.target.id==='directory-filter'){directoryStatus=ev.target.value;render()}});
document.addEventListener('submit',ev=>{if(ev.target.id==='new-client-form'){ev.preventDefault();let f=new FormData(ev.target);const name=String(f.get('first')).trim()+' '+String(f.get('last')).trim();if(!name.trim())return;const id='C-'+String(clients.length+1).padStart(4,'0');const initials=name.trim().split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join('');clients.push({id,name,initials,email:String(f.get('email')||''),phone:'',status:'New Intake',last:'Just created',step:'Complete client intake',household:'',goals:'',note:'',income:null,necessary:null,debt:null,debtPay:null,debtPlan:null});document.getElementById('modalhost').innerHTML='';directoryQuery='';directoryStatus='all';switchTab('directory');setToast('Fictional client added for this preview only.')}if(ev.target.id==='new-note-form'){ev.preventDefault();const c=getClient(activeTab);const value=document.getElementById('new-note').value.trim();if(c&&value){c.demoNotes=c.demoNotes||[];c.demoNotes.unshift({date:'Preview session · not persisted',text:value});document.getElementById('modalhost').innerHTML='';goto('notes');setToast('Demo note added in memory (not saved to disk).')}}});
document.getElementById('demoNotice').addEventListener('click',()=>setToast('This local HTML prototype has no connection to your client database.'));
render();
</script>
</body>
</html>
