[package]
name = "eisenbart-counseling-suite"
version = "0.37.0"
description = "Offline financial counseling desktop foundation"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "eisenbart_counseling_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
png = "=0.18.1"
base64 = "=0.22.1"
tauri = { version = "2.12.3", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = { version = "0.5", features = ["zeroize"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "=0.10.4"
hmac = "0.12.1"
sha2 = "0.10.9"
tauri-plugin-dialog = "2"
fs2 = "0.4.3"
ttf-parser = "=0.25.1"
tempfile = "3"
csv = "1.4.0"
pdf-extract = "=0.12.1"
lopdf = { version = "=0.42.0", default-features = false }


[profile.dev]
debug = 0

[profile.test]
debug = 0

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
